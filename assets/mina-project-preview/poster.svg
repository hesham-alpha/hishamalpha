<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#17181d"/>
      <stop offset=".55" stop-color="#0c0c0c"/>
      <stop offset="1" stop-color="#17151b"/>
    </linearGradient>
    <linearGradient id="title" x2="0" y2="1">
      <stop stop-color="#646973"/>
      <stop offset="1" stop-color="#bbccd7"/>
    </linearGradient>
    <linearGradient id="button" x2="1" y2="1">
      <stop stop-color="#18011f"/>
      <stop offset=".42" stop-color="#b600a8"/>
      <stop offset=".76" stop-color="#7621b0"/>
      <stop offset="1" stop-color="#be4c00"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#765184" stop-opacity=".26"/>
      <stop offset="1" stop-color="#0c0c0c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="portraitClip"><circle cx="800" cy="475" r="300"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="490" rx="650" ry="510" fill="url(#glow)"/>
  <g fill="#d7e2ea" font-family="Kanit, Arial, sans-serif" font-size="23" font-weight="500" letter-spacing="2">
    <text x="70" y="78">ABOUT</text>
    <text x="250" y="78">PRICE</text>
    <text x="430" y="78">PROJECTS</text>
    <text x="1425" y="78">CONTACT</text>
  </g>
  <text x="800" y="344" text-anchor="middle" fill="url(#title)" font-family="Kanit, Arial, sans-serif" font-size="204" font-weight="900" letter-spacing="-8">Hi, I am Alpha</text>
  <image href="portrait-assets/rest.webp" x="500" y="175" width="600" height="600" preserveAspectRatio="xMidYMid meet" clip-path="url(#portraitClip)"/>
  <g fill="#d7e2ea" font-family="Kanit, Arial, sans-serif" font-size="23" font-weight="300" letter-spacing="2">
    <text x="76" y="768">A 3D CREATOR DRIVEN BY</text>
    <text x="76" y="804">CRAFTING STRIKING PROJECTS</text>
  </g>
  <rect x="1300" y="750" width="220" height="76" rx="38" fill="url(#button)" stroke="#fff" stroke-width="3"/>
  <text x="1410" y="797" text-anchor="middle" fill="#fff" font-family="Kanit, Arial, sans-serif" font-size="23" font-weight="500" letter-spacing="2">CONTACT ME</text>
  <rect x="1" y="1" width="1598" height="898" rx="28" fill="none" stroke="#d6e6f4" stroke-opacity=".22" stroke-width="2"/>
</svg>
